# Prefer connected Bluetooth outputs over USB monitor audio and HDMI.
# Keep the priority below 1500 so sink monitors do not outrank microphones.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output.*" }
    ]
    actions = {
      update-props = {
        priority.session = 1400
      }
    }
  }
]
